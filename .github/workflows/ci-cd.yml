name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [created]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check source
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Select lint baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "LINT_BASE_REF=origin/$PR_BASE_REF" >> "$GITHUB_ENV"
          else
            echo "LINT_BASE_REF=$PUSH_BASE_SHA" >> "$GITHUB_ENV"
          fi

      - name: Lint changed source with the strict policy
        run: npm run lint

  unit-and-cli:
    name: Unit and CLI (Node ${{ matrix.node-version }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '22']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit -- --runInBand

      - name: Run CLI end-to-end tests
        run: npm run test:e2e -- --runInBand

  runtime-dependency-audit:
    name: Runtime dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Fail on moderate-or-higher runtime dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate

      - name: Record full dependency audit
        env:
          AUDIT_REPORT_OUTPUT: ${{ runner.temp }}/full-dependency-audit.json
        run: node scripts/report-dependency-audit.js

      - name: Upload full dependency audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-dependency-audit
          path: ${{ runner.temp }}/full-dependency-audit.json
          if-no-files-found: warn
          retention-days: 14

  package-smoke:
    name: Package smoke test
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Pack the current checkout
        run: npm pack --json > "$RUNNER_TEMP/kinetic-pack.json"

      - name: Install and exercise the packed artifact
        shell: bash
        run: |
          TARBALL="$(node -e "const fs = require('node:fs'); const [pack] = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(pack.filename);" "$RUNNER_TEMP/kinetic-pack.json")"
          CONSUMER_DIR="$RUNNER_TEMP/kinetic-consumer"
          mkdir -p "$CONSUMER_DIR"
          cd "$CONSUMER_DIR"
          npm init --yes
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          node <<'NODE'
          const kinetic = require('@tzigger/kinetic');
          const testing = require('@tzigger/kinetic/testing');
          const { ElementScanner } = require('@tzigger/kinetic/scanners/active/ElementScanner');
          const { SqlInjectionDetector } = require('@tzigger/kinetic/detectors/active/SqlInjectionDetector');
          const { VulnerabilitySeverity } = require('@tzigger/kinetic/types');

          const requiredExports = [
            [kinetic, 'ScanEngine'],
            [kinetic, 'runActiveSecurityScan'],
            [testing, 'runPassiveSecurityScan'],
            [{ ElementScanner }, 'ElementScanner'],
            [{ SqlInjectionDetector }, 'SqlInjectionDetector'],
            [{ VulnerabilitySeverity }, 'VulnerabilitySeverity'],
          ];
          for (const [module, exportName] of requiredExports) {
            if (typeof module[exportName] === 'undefined') {
              throw new Error(`Missing package export: ${exportName}`);
            }
          }
          console.log('Kinetic public and testing exports loaded from the packed artifact');
          NODE
          cp "$GITHUB_WORKSPACE/tests/fixtures/package-consumer-types.ts" package-types-smoke.ts
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --module Node16 --moduleResolution Node16 --target ES2022 --types node --lib ES2022,DOM,ESNext.Disposable package-types-smoke.ts
          ./node_modules/.bin/kinetic --help

  vulnerable-app-regressions:
    name: Vulnerable app regressions
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Start Juice Shop and bWAPP
        run: docker compose -f docker-compose.vuln-apps.yml up -d --wait --wait-timeout 180 juice-shop bwapp

      - name: Initialize bWAPP
        shell: bash
        run: |
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 --silent --show-error \
            "http://localhost:8082/install.php?install=yes" > /dev/null
          timeout 120 bash -c 'until curl --fail --silent http://localhost:8082/login.php | grep -q "name=\"login\""; do sleep 2; done'

      - name: Run Juice Shop scanner regressions
        env:
          JUICE_SHOP_URL: http://localhost:3000
        run: npm run test:juice-shop

      - name: Run bWAPP scanner regressions
        env:
          BWAPP_URL: http://localhost:8082
        run: |
          rm -f storage-states/bwapp-auth.json
          npm run test:bwapp:regression

      - name: Upload browser-test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vulnerable-app-regression-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop vulnerable applications
        if: always()
        run: docker compose -f docker-compose.vuln-apps.yml down --volumes --remove-orphans

  publish-npm:
    name: Publish to npm
    needs:
      [quality, unit-and-cli, runtime-dependency-audit, package-smoke, vulnerable-app-regressions]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release notes
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: `## Published to npm

            \`\`\`bash
            npm install @tzigger/kinetic@${packageJson.version}
            \`\`\`

            ${context.payload.release.body || ''}`,
            });

  draft-release:
    name: Draft release
    needs:
      [quality, unit-and-cli, runtime-dependency-audit, package-smoke, vulnerable-app-regressions]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create or update draft release
        uses: actions/github-script@v8
        env:
          CHANGELOG: ${{ steps.changelog.outputs.commits }}
        with:
          script: |
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = packageJson.version;
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const draftRelease = releases.data.find(
              (release) => release.draft && release.tag_name === `v${version}`
            );
            const changes = process.env.CHANGELOG || 'No user-visible changes.';
            const body = `## Changes

            ${changes}

            ## Installation

            \`\`\`bash
            npm install @tzigger/kinetic@${version}
            \`\`\``;

            if (draftRelease) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draftRelease.id,
                body,
              });
            } else {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: `v${version}`,
                name: `v${version}`,
                body,
                draft: true,
                prerelease: version.includes('beta') || version.includes('alpha'),
              });
            }
